packages:
  - "apps/*"
  - "packages/*"

catalog:
  react: ^19.3.1
  react-dom: ^19.3.1
  zod: ^4.6.7
  typescript: ^5.9.3
  vite: ^8.3.5
  vitest: ^5.0.5
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@types/node": ^22.0.0
  tsx: ^4.20.0

onlyBuiltDependencies:
  - esbuild
  - node-pty

# better-sqlite3 ships prebuilt binaries for Windows, macOS and Linux inside its npm package and loads them before it
# looks at build/. Letting it build only makes pnpm run `node-gyp rebuild` (the package has a binding.gyp), which fails
# on a PC without a C++ toolchain. Do not add it to onlyBuiltDependencies. apps/daemon/test/native-addons.test.ts guards this.
ignoredBuiltDependencies:
  - better-sqlite3
